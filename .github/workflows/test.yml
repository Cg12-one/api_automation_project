name: API自动化测试

# 触发条件
on:
  push:
    branches: [main,develop]
  pull_request:
    branches: [main]
  schedule:
    # 每天早上9点自动运行(UTC时间)
    - cron: '0 1 * * *'

# 工作内容
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 检出代码 
      uses: actions/checkout@v4

    - name: 设置python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python  -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行测试
      id: test
      run: |
        pytest tests/ -v \
          --tb=short \
          --alluredir=reports/allure-results \
          --html=reports/pytest_report.html \
          --self-contained-html \
          --json-report \
          --json-report-file=reports/result.json

    - name: 解析测试结果
      id: summary
      if: always()
      run: |
        # 初始化默认值
        total=0
        passed=0
        failed=0
        status="passed"
        
        # 尝试解析 JSON 报告
        if [ -f reports/result.json ]; then
          total=$(cat reports/result.json | jq '.summary.num_tests // 0')
          passed=$(cat reports/result.json | jq '.summary.num_passed // 0')
          failed=$(cat reports/result.json | jq '.summary.num_failed // 0')
          
          # 判断状态
          if [ "$failed" -gt 0 ]; then
            status="failed"
          fi
        else
          # 如果文件不存在，使用默认值
          echo "⚠️ 未找到 result.json，使用默认值"
        fi
        
        # 设置输出
        echo "total=$total" >> $GITHUB_OUTPUT
        echo "passed=$passed" >> $GITHUB_OUTPUT
        echo "failed=$failed" >> $GITHUB_OUTPUT
        echo "status=$status" >> $GITHUB_OUTPUT
        
        echo "解析结果：total=$total, passed=$passed, failed=$failed, status=$status"

    - name: 上传报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: reports/pytest_report.html

    - name: 上传覆盖率
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
    
    - name: 上传allure结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: reports/allure-results/

    # ========== 发送钉钉通知（新增） ==========
    - name: 发送钉钉通知
      if: always()
      env:
        DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        # 检查 webhook 是否设置
          if [ -z "$DINGTALK_WEBHOOK" ]; then
            echo "❌ 错误：DINGTALK_WEBHOOK 未设置"
            exit 0  # 不中断流程
          fi
          
        python utils/send_dingtalk.py \
          --webhook $DINGTALK_WEBHOOK \
          --total ${{ steps.summary.outputs.total }} \
          --passed ${{ steps.summary.outputs.passed }} \
          --failed ${{ steps.summary.outputs.failed }} \
          --status ${{ steps.summary.outputs.status }}  