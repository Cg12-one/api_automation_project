name: API自动化测试

# 触发条件
on:
  push:
    branches: [main,develop]
  pull_request:
    branches: [main]
  schedule:
    # 每天早上9点自动运行(UTC时间)
    - cron: '0 1 * * *'

# 工作内容
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 检出代码 
      uses: actions/checkout@v4

    - name: 设置python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python  -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行测试
      id: test
      run: |
        pytest tests/ -v \
          --tb=short \
          --alluredir=reports/allure-results \
          --html=reports/pytest_report.html \
          --self-contained-html \
          --json-report \
          --json-report-file=reports/result.json

    - name: 解析测试结果
      id: summary
      if: always()
      run: |
        # 解析JSON报告
        total=$(cat reports/result.json | jq '.summary.num_tests')
        passed=$(cat reports/result.json | jq '.summary.num_passed')
        failed=$(cat reports/result.json | jq '.summary.num_failed')
        
        # 设置输出变量
        echo "total=$total" >> $GITHUB_OUTPUT
        echo "passed=$passed" >> $GITHUB_OUTPUT
        echo "failed=$failed" >> $GITHUB_OUTPUT
        
        # 设置状态
        if [ "$failed" -gt 0 ]; then
          echo "status=failed" >> $GITHUB_OUTPUT
        else
          echo "status=passed" >> $GITHUB_OUTPUT
        fi

    - name: 上传报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: reports/pytest_report.html

    - name: 上传覆盖率
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
    
    - name: 上传allure结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: reports/allure-results/

    # ========== 发送钉钉通知（新增） ==========
    - name: 发送钉钉通知
      if: always()
      env:
        DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python utils/send_dingtalk.py \
          --webhook $DINGTALK_WEBHOOK \
          --total ${{ steps.summary.outputs.total }} \
          --passed ${{ steps.summary.outputs.passed }} \
          --failed ${{ steps.summary.outputs.failed }} \
          --status ${{ steps.summary.outputs.status }}  