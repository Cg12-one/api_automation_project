#登录接口测试数据


success:
  description: "成功登录 - 正确用户名密码"
  endpoint: /post
  method: POST
  json:
    username: admin
    password: "123456"
  expected:
    status_code: 200
    response_contaions: "admin"
  priority: P0

fail_wrong_password:
  description: "登录失败 - 密码错误"
  endpoint: /post
  method: POST
  json:
    username: admin
    password: "wrong_password"
  expected:
    #真实网页反馈 status_code: 401
    status_code: 200
    error_message: "密码错误"
  priority: P0

fail_empty_username:
  description: "登录失败 - 用户名为空"
  endpoint: /post
  method: POST
  json:
    username: 
    password: "123456"
  expected:
    #真实网页反馈 status_code: 400
    status_code: 200
    error_message: "用户名不能为空"
  priority: P1

fail_empty_password:
  description: "登录失败 - 密码为空"
